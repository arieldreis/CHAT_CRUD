<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Senha | Chat-Crud</title>
    <link rel="stylesheet" href="../styles/alterar_cadastro.css">
</head>
<body>
    <div class="glass-card">
        <h2>Alterar Senha</h2>
        <form method="post" action="/updateuser/:id">
            <input type="hidden" name="_method" value="PUT">
            <div class="input-group">
                <input type="email" name="email" id="emailId" placeholder="Digite seu email">
                <span>🔒</span>
            </div>
            <div class="input-group">
                <input type="password" placeholder="Digite sua nova senha" required>
                <span>🔒</span>
            </div>
            <button type="submit" class="btn-submit">Atualizar Senha</button>
        </form>
    </div>
</body>
</html>
