<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Simples</title>
  <link rel="stylesheet" href="../styles/chat.css">
  <script src="../scripts/chat.js" defer></script>
</head>
<body>
  <header class="navbar">
  <div class="user-greeting">Olá, <strong>Usuário!</strong></div>
  <button class="hamburger" id="hamburger" aria-label="Abrir menu">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <nav>
    <ul class="nav-links" id="navLinks">
      <li><a href="#">Início</a></li>
      <li><a href="/alterarDados">Alterar</a></li>
      <li><a href="/excluirDados">Exluir</a></li>
    </ul>
  </nav>
</header>
  <main class="chat-container">
    <div class="chat-window" id="chatWindow">
      <!--Aqui será o chat interativo-->
    </div>
    <form class="chat-input-area" id="chatForm">
      <input id="userInput" type="text" placeholder="Digite sua mensagem..." required>
      <button type="submit">Enviar</button>
    </form>
  </main>

</body>
</html>
