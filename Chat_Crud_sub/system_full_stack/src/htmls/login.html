<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/login.css" />
    <script src="../scripts/login.js" defer></script>
    <title>Login</title>
  </head>
  <body>
    <main class="container">
      <form method="get" action="http://localhost:3000/accountuser">
        <h1>Login Chat-Crud</h1>
        <div class="inputbox">
          <input placeholder="Email" type="email" name="nome_user" id="nome_userId"/>
          <i class="bx bxs-user"></i>
        </div>
        <div class="inputbox">
          <input placeholder="Senha" type="password" name="senha" id="senhaId"/>
          <i class="bx bxs-lock-alt"></i>
        </div>
        <div class="remember-forgot">
          <label>
            <input type="checkbox" />
            Lembrar senha
          </label>
          <a href="alterar_cadastro.html">Esqueci a senha</a>
        </div>
        <button type="submit" class="login">Login</button>
        <div class="register-link">
          <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
        </div>
      </form>
    </main>
  </body>
</html>
