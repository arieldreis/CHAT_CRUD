<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/cadastro.css" />
    <title>Cadastro</title>
  </head>
  <body>
    <main class="container">
      <form method="post" action="http://localhost:3000/createAccountUser">
        <h1>Cadastro Chat-Crud</h1>
        <div class="inputbox">
          <input placeholder="Digite seu Nome de Usuário" type="text" name="nome_user"/>
          <i class="bx bxs-user"></i>
        </div>
        <div class="inputbox">
          <input placeholder="Digite seu Email" type="email" name="email"/>
          <i class="bx bxs-user"></i>
        </div>
        <div class="inputbox">
          <input placeholder="Digite uma senha" type="password" name="senha"/>
          <i class="bx bxs-lock-alt"></i>
        </div>
        <div class="remember-forgot">
          <input type="checkbox" />
          <p>Lembrar senha</p>
        </div>
        <button type="submit" class="login">Cadastrar</button>
      </form>
    </main>
  </body>
</html>
